[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyDeciders"
version = "0.1.0"
description = "Roll dice, flip coins, and spin a wheel, with tiny terminal animations."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Sanay Daptardar" },
  { name = "Jialiang Cao" },
  { name = "Ryan Jiang" },
  { name = "Yi Fei" },
]
keywords = ["decisions", "dice", "coin", "random", "cli", "fun"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["rich"]

[project.urls]
Homepage = "https://github.com/software-students-fall2026/python-pac
Repository = "https://github.com/software-students-fall2026/python-package-exercise-goodTeam"

[project.scripts]
decisions = "pyDeciders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
